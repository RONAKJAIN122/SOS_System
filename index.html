<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadSOS Emergency Help Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <button class="brand-btn" id="home-btn" type="button">RoadSOS</button>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">
      Light
    </button>
  </header>

  <main class="home" id="home">
    <h1>Emergency Help</h1>
    <p class="subtitle">Find hospitals, police &amp; ambulance near you.</p>

    <button id="find-btn">Find Nearby Help</button>
    <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading nearby help"></div>
    <p id="status"></p>

    <div id="results">
      <div class="section hospitals">
        <h2>Hospitals</h2>
        <div class="cards" id="hospitals-list"></div>
      </div>
      <div class="section police">
        <h2>Police Stations</h2>
        <div class="cards" id="police-list"></div>
      </div>
      <div class="section ambulance">
        <h2>Ambulance Services</h2>
        <div class="cards" id="ambulance-list"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>

</body>
</html>
