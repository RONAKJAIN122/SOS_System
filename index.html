<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Help Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <button class="brand-btn" id="home-btn" type="button" aria-label="Return to Road SOS home">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M4 21V9.8L12 3l8 6.8V21h-6v-5h-4v5H4Z" />
          <path d="M11 7h2v3h3v2h-3v3h-2v-3H8v-2h3V7Z" />
        </svg>
      </span>
      <span>Road SOS</span>
    </button>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">
      <span class="theme-icon" aria-hidden="true">☀</span>
      <span class="theme-text">Light</span>
    </button>
  </header>

  <h1>🚨 Emergency Help</h1>
  <p class="subtitle">Find hospitals, police &amp; ambulance near you.</p>

  <button id="find-btn">Find Nearby Help</button>
  <p id="status"></p>

  <div id="results">
    <div class="section hospitals">
      <h2>🏥 Hospitals</h2>
      <div class="cards" id="hospitals-list"></div>
    </div>
    <div class="section police">
      <h2>👮 Police Stations</h2>
      <div class="cards" id="police-list"></div>
    </div>
    <div class="section ambulance">
      <h2>🚑 Ambulance Services</h2>
      <div class="cards" id="ambulance-list"></div>
    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
